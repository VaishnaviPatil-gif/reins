services:
  # Backend FastAPI web service
  - type: web
    name: reins-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: PUBLIC_BASE_URL
        sync: false  # Set to https://reins-api.onrender.com in Render Dashboard
      - key: FRONTEND_BASE_URL
        sync: false  # Set to https://reins-frontend.onrender.com in Render Dashboard
      - key: PAYPAL_VAULT_FALLBACK
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: REINS_SIGNING_SECRET
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./reins.db

  # Frontend React static site
  - type: web
    name: reins-frontend
    runtime: static
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to https://reins-api.onrender.com in Render Dashboard
